---
- name: Installation Engine-X7
  hosts: webservers
  become: yes
  tasks:
    - name: Apt Step
      ansible.builtin.apt:
        state: present
        name: nginx
        update_cache: yes
        cache_valid_time: 3600

    - name: Déployer la page d'accueil personnalisée
      ansible.builtin.copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: System Check
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes
